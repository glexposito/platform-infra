name: Provision Platform
run-name: Provision Platform (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
      command:
        description: "Terragrunt command"
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

jobs:
  prepare_deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
      working_dir: ${{ steps.resolve.outputs.working_dir }}
    steps:
      - name: Resolve platform path
        id: resolve
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys

          env = os.environ["INPUT_ENVIRONMENT"]
          mapping = {
              "dev": ("dev", "live/non-prod/southeastasia/dev/platform-nc"),
          }

          if env not in mapping:
            print(f"Unsupported environment: {env}", file=sys.stderr)
            sys.exit(1)

          environment_name, working_dir = mapping[env]
          print(f"environment_name={environment_name}")
          print(f"working_dir={working_dir}")
          PY

  deploy:
    needs: prepare_deployment
    name: Deploy Platform (${{ needs.prepare_deployment.outputs.environment_name }})
    uses: ./.github/workflows/_terragrunt-deploy.yml
    secrets: inherit
    with:
      working_dir: ${{ needs.prepare_deployment.outputs.working_dir }}
      environment_name: ${{ needs.prepare_deployment.outputs.environment_name }}
      command: ${{ inputs.command }}
      concurrency_group: platform-deploy-${{ needs.prepare_deployment.outputs.environment_name }}
