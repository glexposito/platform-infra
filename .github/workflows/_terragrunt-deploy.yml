name: Terragrunt Deploy

on:
  workflow_call:
    inputs:
      working_dir:
        description: "Directory containing the terragrunt.stack.hcl to deploy"
        required: true
        type: string
      environment_name:
        description: "GitHub Environment to deploy to"
        required: true
        type: string
      command:
        description: "Terragrunt command to run (plan or apply)"
        required: true
        type: string
      concurrency_group:
        description: "Concurrency group key for this deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy (${{ inputs.environment_name }})
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: ${{ inputs.concurrency_group }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_dir }}
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      STATUSPAGE_API_KEY: ${{ secrets.STATUSPAGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Azure login
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform + Terragrunt
        uses: jdx/mise-action@v4.0.0
        with:
          version: 2026.3.9

      - name: Terragrunt stack generate
        run: terragrunt stack generate

      - name: Terragrunt init
        run: terragrunt run --all --non-interactive init

      - name: Terragrunt plan
        run: terragrunt run --all --non-interactive plan -- -no-color

      - name: Terragrunt apply
        if: inputs.command == 'apply'
        run: terragrunt run --all --non-interactive apply -- -auto-approve -no-color
